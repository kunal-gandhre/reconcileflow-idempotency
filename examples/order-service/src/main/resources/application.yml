spring:
  main:
    web-application-type: none
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # Spring controls commits after successful synchronous listener completion.
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # This demo uses the entire string payload as its stable event identity.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # A completed duplicate returns normally and advances the offset; failures enter the error handler.
      ack-mode: record
