name: Deploy website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
# Pages deployment needs artifact access and a short-lived OIDC token, not a stored personal token.
permissions:
  contents: read
  pages: write
  id-token: write
# Serialize deployments so an older upload cannot overwrite a newer site.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build --prefix website
      - uses: actions/configure-pages@v5
      # Publish only the build output, never source files or local development tooling.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4
        id: deployment
