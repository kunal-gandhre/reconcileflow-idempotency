name: CI
on: [push, pull_request]
permissions:
  contents: read
# Each job uses isolated infrastructure; Redis tests are explicitly enabled rather than silently skipped.
jobs:
  # Compile all Maven modules and exercise unit, wiring and real Redis integration tests.
  java:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp verify
        env:
          REDIS_INTEGRATION: 'true'
  # Run static checks and the race detector against the Go wrapper and Redis scripts.
  go:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          REDIS_INTEGRATION: 'true'
  # The static website uses Node built-ins and requires no npm dependency installation.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build --prefix website
